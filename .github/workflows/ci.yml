name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same 7-Zip as the Docker image, so the real-unpacking tests run (keep in step with the Dockerfile).
      - name: Install 7-Zip
        run: |
          curl -fsSL -o /tmp/7z.tar.xz https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz
          echo "2b539cf067b2ad48e1baa5093dbaa8818b73542d1222a0ffde9dc5f2922ea62e  /tmp/7z.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/7z.tar.xz -C /usr/local/bin 7zz
          7zz i | head -n 3
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The iPhone app's logic (models, API client). Swift 6.2 needs the macOS 26 image.
  # The fixtures it decodes are kept fresh by the server tests above.
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: apps/ios/Packages/MarqueeKit
