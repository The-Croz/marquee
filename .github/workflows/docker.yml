name: Docker image

# Builds on every PR (no push) and publishes to GitHub Container Registry
# from main and from version tags (v1.2.3). Can also be run by hand on a
# branch (the FlareSolverr updater does this, since PRs it opens don't start CI).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/the-croz/marquee

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=ref,event=pr
      # Build once and prove the image actually starts before publishing it.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: marquee:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (Unraid-style PUID/PGID)
        run: |
          mkdir -p /tmp/cfg
          sudo chown root:root /tmp/cfg
          docker run -d --name mq -e PUID=99 -e PGID=100 -v /tmp/cfg:/config -p 9797:9797 marquee:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:9797/api/health && break; sleep 1; done
          curl -fsS http://localhost:9797/api/health
          curl -fsS http://localhost:9797/ | grep -q '<div id="root">'
          owner=$(stat -c '%u:%g' /tmp/cfg/marquee.sqlite)
          echo "database owner: $owner"
          test "$owner" = "99:100"
          # PID 1 is the app itself (the entrypoint execs into it): check its real and effective uid
          docker exec mq grep '^Uid:' /proc/1/status
          docker exec mq grep -qE '^Uid:[[:space:]]+99[[:space:]]+99[[:space:]]' /proc/1/status
          # The bot-check solver inside the image starts (as Marquee's user) and answers
          curl -fsS -c /tmp/jar -H 'Content-Type: application/json' -d '{"username":"ci","password":"ci password 12345","displayName":"CI"}' http://localhost:9797/api/auth/setup
          curl -fsS -b /tmp/jar -X PUT -H 'Content-Type: application/json' -d '{"enabled":true}' http://localhost:9797/api/settings/sources/solver
          curl -fsS -m 150 -b /tmp/jar -H 'Content-Type: application/json' -d '{}' http://localhost:9797/api/settings/sources/solver/test | tee /tmp/solver.json
          grep -q '"ok":true' /tmp/solver.json
          docker logs mq
      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tags get their version (1.2.3); everything else gets the commit, e.g. "main-f00a740"
          build-args: VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.meta.outputs.version || format('{0}-{1}', github.ref_name, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
