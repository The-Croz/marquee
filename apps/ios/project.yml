name: Marquee
options:
  bundleIdPrefix: marquee.ios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Signing: Josh's personal Apple team only. Never the Renovation Church team
# (P73FA44C6D), even though Xcode is signed in to it. When the paid personal
# account is set up, its team id replaces the one below.
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 2PAYMW97LM
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  MarqueeKit:
    path: Packages/MarqueeKit

targets:
  Marquee:
    type: application
    platform: iOS
    sources:
      - path: Marquee
        excludes:
          - Resources/Info.plist
      - path: Shared
    dependencies:
      - package: MarqueeKit
      - target: MarqueeNotify
      - target: MarqueeWidgets
    info:
      path: Marquee/Resources/Info.plist
      properties:
        CFBundleDisplayName: Marquee
        UILaunchScreen:
          UIColorName: LaunchInk
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
        CFBundleURLTypes:
          - CFBundleURLName: marquee.ios.app
            CFBundleURLSchemes:
              - marquee
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Marquee talks to your Marquee server on your home network.
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: marquee.ios.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

  # Puts the cover art on a push.
  MarqueeNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: MarqueeNotify
        excludes:
          - Info.plist
    dependencies:
      - package: MarqueeKit
    info:
      path: MarqueeNotify/Info.plist
      properties:
        CFBundleDisplayName: Marquee Notifications
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: marquee.ios.app.notify
        TARGETED_DEVICE_FAMILY: "1"

  # The Lock Screen card that follows a download.
  MarqueeWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MarqueeWidgets
        excludes:
          - Info.plist
      - path: Shared
      - path: Marquee/Resources/Fonts
    info:
      path: MarqueeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Marquee Lock Screen
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: marquee.ios.app.widgets
        TARGETED_DEVICE_FAMILY: "1"

  MarqueeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MarqueeUITests
    dependencies:
      - target: Marquee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: marquee.ios.app.uitests
        TEST_TARGET_NAME: Marquee
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Marquee:
    build:
      targets:
        Marquee: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarqueeUITests
