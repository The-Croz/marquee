---
# A private site you sign in to with a username and password.
id: exampleprivate
name: ExamplePrivate
description: "A private test site"
language: en-US
type: private
links:
  - https://priv.test/

caps:
  categorymappings:
    - {id: 10, cat: Movies/HD, desc: "Movies HD"}
    - {id: 20, cat: TV/HD, desc: "TV HD"}
  modes:
    search: [q]
    tv-search: [q, season, ep, imdbid]
    movie-search: [q, imdbid]

settings:
  - name: username
    type: text
    label: Username
  - name: password
    type: password
    label: Password
  - name: freeleech
    type: checkbox
    label: Search freeleech only
    default: false

login:
  path: login.php
  method: form
  form: form#login
  inputs:
    username: "{{ .Config.username }}"
    password: "{{ .Config.password }}"
  error:
    - selector: div.error
  test:
    path: index.php
    selector: a[href="logout.php"]

search:
  paths:
    - path: browse.php
  inputs:
    $raw: "{{ range .Categories }}c{{.}}=1&{{end}}"
    search: "{{ if .Query.IMDBID }}{{ .Query.IMDBID }}{{ else }}{{ .Keywords }}{{ end }}"
    free: "{{ if .Config.freeleech }}1{{ else }}{{ end }}"
  rows:
    selector: tr.torrent
  fields:
    title:
      selector: td.name a
    details:
      selector: td.name a
      attribute: href
    download:
      selector: a.dl
      attribute: href
    size:
      selector: td.size
    seeders:
      selector: td.seeds
    leechers:
      selector: td.leech
    date:
      selector: td.added
      filters:
        - name: dateparse
          args: "yyyy-MM-dd HH:mm"
    downloadvolumefactor:
      case:
        span.free: 0
        "*": 1
